    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:wght@300;400;500;600&family=Cinzel:wght@500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      :root {
        /* CSS Variables for Safe Areas provided by Capacitor/Browser */
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      * {
        -webkit-tap-highlight-color: transparent; /* Remove grey tap highlight on mobile */
        -webkit-touch-callout: none; /* Disable long press menu (iOS) */
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* App feel: no body scroll */
        overscroll-behavior-y: none; /* Disable pull-to-refresh effect */
        touch-action: pan-x pan-y;
      }

      body { 
        font-family: 'Crimson Pro', serif; 
        background-color: #ecfdf5; 
        user-select: none; /* Disable text selection globally */
        -webkit-user-select: none;
        padding-top: var(--sat); /* Handle Notch area globally */
        padding-bottom: 0; /* Handled by individual views/nav */
        padding-left: var(--sal);
        padding-right: var(--sar);
      }

      /* Allow selection only in specific input areas */
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
        /* Prevent font zooming on focus in iOS */
        font-size: 16px; 
      }

      /* Custom Scrollbar Hiding */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .islamic-pattern {
        background-image: radial-gradient(#047857 0.7px, transparent 0.7px), radial-gradient(#047857 0.7px, #ecfdf5 0.7px);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
        opacity: 0.04; 
      }
      
      /* Utility classes for Safe Areas */
      .pt-safe { padding-top: var(--sat); }
      .pb-safe { padding-bottom: var(--sab); }
      .mb-safe { margin-bottom: var(--sab); }
    </style>
